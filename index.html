<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte au Trésor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3h7vK4e3FQ6f3Q5f5z5m5x5z5x5z5="
        crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>🗺️ Carte au Trésor</h1>
      <p>Retrouve le lieu avant la fin du chrono.</p>
    </div>
    <div id="timer" class="timer">03:00</div>
  </header>

  <main class="game-layout">
    <aside class="panel">
      <div class="clue-card">
        <div class="clue-label">INDICE <span id="clue-number">1</span>/3</div>
        <p id="clue-text">Chargement...</p>
      </div>

      <div class="status-card">
        <strong id="status-title">À toi de jouer</strong>
        <p id="status-text">Explore la carte puis clique sur l'endroit où tu penses que se trouve le trésor.</p>
      </div>

      <button id="try-button" class="primary-button" disabled>📍 JE TENTE !</button>
      <button id="restart-button" class="secondary-button">Nouvelle partie</button>

      <div id="result" class="result hidden"></div>
    </aside>

    <section class="map-wrapper">
      <div id="map"></div>
    </section>
  </main>

  <footer>
    Carte © OpenStreetMap contributors
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="js/map.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
